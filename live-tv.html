
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMRANI TV - Live TV</title>

<link rel="stylesheet" href="style.css">

<style>
.tamasha-wrap {
    position: relative;
    width: 100%;
    height: min(75vh, 760px);
    min-height: 420px;
    background: #000;
    border: 1px solid #444;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 18px;
}

.tamasha-frame {
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
}

.umrani-watermark {
    position: absolute;
    z-index: 2;
    right: 12px;
    bottom: 12px;
    padding: 7px 11px;
    border-radius: 8px;
    background: #000b;
    color: #ffe34d;
    font-weight: 900;
    text-shadow: 0 0 8px #ff4938;
    pointer-events: none;
}

.tamasha-note {
    color: #bbb;
    text-align: center;
    line-height: 1.6;
    margin: 14px 0;
}

.tamasha-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 12px;
}

@media(max-width:500px) {
    .tamasha-wrap {
        height: 68vh;
        min-height: 360px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <a class="brand" href="index.html">
        𓆩UM꧊ꝛ͢𓂃aNi <span>TV</span>
    </a>
</header>

<main class="page">

    <a class="back" href="index.html">← Home</a>

    <h1 class="title">📺 Live TV</h1>

    <div class="tamasha-wrap">

        <iframe
            class="tamasha-frame"
            src="https://tamashaweb.com/"
            title="Tamasha Live TV"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            loading="eager"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

        <div class="umrani-watermark">
            𓆩UMRANI TV𖡼
        </div>

    </div>

    <p class="tamasha-note">
        Tamasha ko UMRANI TV ke andar kholne ki koshish ki ja rahi hai.
        Agar Tamasha iframe mein chalne ki ijazat na de,
        to neeche wala button isi tab mein Tamasha khol dega.
    </p>

    <div class="tamasha-actions">

        <button class="btn" type="button"
        onclick="window.location.href='https://tamashaweb.com/'">
            Open Tamasha Here
        </button>

        <a class="btn" href="index.html">
            Back to UMRANI TV
        </a>

    </div>

</main>

</body>
</html>
